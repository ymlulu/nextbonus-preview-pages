<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>NextBonus · Admin</title>
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div><a class="brand" href="../index.html">Next<span>Bonus</span></a><span class="badge">Admin</span></div>
      <div class="top-actions"><button type="button" class="secondary" id="logout" hidden>退出后台</button><a class="back" href="../index.html">← 返回 Discover</a></div>
    </header>
    <main>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <section id="login-view" class="login-wrap">
        <form id="login-form" class="login-card">
          <div class="login-mark" aria-hidden="true">NB</div>
          <h1>NextBonus Admin</h1>
          <p>输入管理密码，继续管理优惠。</p>
          <label for="admin-password">密码</label>
          <input id="admin-password" name="password" type="password" required autocomplete="current-password" autofocus placeholder="请输入密码" />
          <button class="primary" type="submit" id="login-submit">登录后台</button>
        </form>
      </section>
      <nav id="admin-tabs" class="admin-tabs" aria-label="后台模块" hidden>
        <button type="button" class="admin-tab active" id="tab-deals" aria-selected="true">Deals</button>
        <button type="button" class="admin-tab" id="tab-cards" aria-selected="false">信用卡</button>
      </nav>
      <section id="card-view" hidden>
        <div class="heading"><div><h1>信用卡</h1><p>选择主 Offer 后直接发布；可直接编辑和新增 Offer；修改只保存在 NextBonus，不会写回 WordPress。</p></div><button id="cards-reload" class="secondary" type="button">刷新</button></div>
        <div class="toolbar">
          <label>搜索 <input id="cards-search" type="search" placeholder="信用卡名称或 Slug" /></label>
          <label>状态 <select id="cards-status"><option value="">全部</option><option value="draft">Draft</option><option value="published">Published</option></select></label>
        </div>
        <p class="small" id="cards-count"></p>
        <div id="cards-list" class="credit-admin-list" aria-live="polite"></div>
      </section>
      <section id="list-view" hidden>
        <div class="heading"><div><h1>Deals</h1><p>添加、修改、发布和下架优惠。发布后 Discover 自动读取最新内容。</p></div><button class="primary" id="new-deal" type="button">＋ Add Deal</button></div>
        <div class="toolbar"><label>搜索 <input id="filter-search" type="search" placeholder="标题、商家或分类" /></label>
        <label>状态 <select id="filter-status"><option value="">全部</option><option value="published">Published</option><option value="draft">Draft</option><option value="archived">Archived</option></select></label>
        <button type="button" id="reload" class="secondary">刷新</button></div>
        <div class="table-wrap"><table><thead><tr><th>Deal</th><th>分类 / 商家</th><th>状态</th><th>更新</th><th>点击</th><th></th></tr></thead><tbody id="deal-rows"><tr><td colspan="6">正在连接 API…</td></tr></tbody></table></div>
        <p id="count" class="small"></p>
      </section>
      <section id="editor-view" hidden>
        <div class="heading"><div><h1 id="editor-title">Add Deal</h1><p>必填标题；发布时必须有有效 HTTPS Deal URL。其他字段可选。</p></div><button type="button" class="secondary" id="cancel-edit">← Deals 列表</button></div>
        <form id="deal-form">
          <div class="fields">
            <label class="wide">标题 * <input name="title" maxlength="180" required placeholder="例如 Amazon 50% Off Gift Card" /></label>
            <label>分类 <input name="category" list="category-options" maxlength="50" placeholder="购物" /><datalist id="category-options"><option value="购物"></option><option value="旅行"></option><option value="羊毛省钱"></option><option value="信用卡"></option><option value="银行"></option><option value="券商"></option><option value="生活"></option></datalist></label>
            <label>商家 <input name="merchant" maxlength="100" placeholder="Amazon" /></label>
            <label class="wide">摘要 <textarea name="summary" rows="2" maxlength="320" placeholder="卡片中展示的短介绍"></textarea></label>
            <label class="wide">详情 <textarea name="description" rows="5" placeholder="优惠详情、使用方法及注意事项"></textarea></label>
            <label>价格（USD） <input name="price" type="number" step="0.01" min="0" placeholder="25.00" /></label>
            <label>原价（USD） <input name="originalPrice" type="number" step="0.01" min="0" placeholder="50.00" /></label>
            <label>奖励文字 <input name="rewardText" maxlength="100" placeholder="例如 100% Cashback / 50,000 Points" /></label>
            <label>Promo Code <input name="promoCode" maxlength="100" /></label>
            <label class="wide">Deal URL * <input name="dealUrl" type="url" placeholder="https://..." /></label>
            <label class="wide">Affiliate URL <input name="affiliateUrl" type="url" placeholder="https://...（选填；优先用于跳转）" /></label>
            <label class="wide">图片 URL <input id="image-url" name="imageUrl" type="url" placeholder="https://...（可粘贴图片链接）" /></label>
            <div class="image-tools wide"><label>或上传图片（PNG / JPG / WebP / GIF，最多 5 MB） <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" /></label><button type="button" class="secondary" id="upload-image">上传图片</button><img id="image-preview" alt="优惠图片预览" hidden /></div>
            <label>开始日期 <input name="startsOn" type="date" /></label>
            <label>结束日期 <input name="expiresOn" type="date" /></label>
            <label>状态 <select name="status"><option value="draft">Draft（草稿）</option><option value="published">Published（发布）</option><option value="archived">Archived（下架）</option></select></label>
            <label>Slug（留空自动生成） <input name="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="amazon-gift-card" /></label>
            <label class="check wide"><input type="checkbox" name="featured" /> Featured（首页推荐）</label>
          </div>
          <div class="actions"><button type="submit" class="primary" id="save-deal">保存 Deal</button><button type="button" class="secondary" id="cancel-edit-bottom">取消</button><button type="button" class="danger" id="delete-deal" hidden>删除 Deal</button></div>
        </form>
      </section>
    </main>
  </div>
  <script src="../features/deals/config.js"></script>
  <script src="./admin.js?v=20261112-2"></script>
  <script src="./credit-cards-admin.js?v=20261112-4"></script>
</body>
</html>
